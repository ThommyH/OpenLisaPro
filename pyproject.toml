[project]
name = "lisa-pro-ui"
version = "0.1.0"
description = "Modern Flask control UI and Python client for the Lisa Pro growbox API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
]

[project.scripts]
lisa-pro-ui = "lisa_pro_ui:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
