x-websocket:
  path: /ws
  protocol: ws
  description: |
    WebSocket upgrade at `ws://{host}/ws` (or `wss://` if TLS were enabled; not observed).
    After `101 Switching Protocols`, the server pushes JSON messages matching the
    `Status` schema (same as `GET /api/status`). No client subscribe message is required
    by the stock UI.
  messages:
    statusPush:
      payload:
        $ref: "#/components/schemas/Status"
